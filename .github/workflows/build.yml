name: Build widgets

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-widgets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (root + src-widgets)
        run: npm run npm

      - name: Type-check, lint, test
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Build customWidgets.js
        run: npm run build

      - name: Commit build output back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f widgets/mywidgets/customWidgets.js widgets/mywidgets/customWidgets.js.map widgets/mywidgets/*.manifest.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit - build output already up to date."
          else
            git commit -m "chore: rebuild customWidgets.js [skip ci]"
            git push
          fi
