name: Build widgets

# Builds src-widgets/ (TypeScript + Vite/Module Federation) and commits the
# result (widgets/mywidgets/customWidgets.js) back into the repository, so
# that `iobroker url https://github.com/<user>/<repo>/archive/refs/heads/main.tar.gz`
# (or the Admin "install from GitHub" flow) always gets a ready-to-use
# adapter - no local Node.js/npm required on the machine that installs it.
#
# Runs on every push to main, and can also be triggered manually from the
# "Actions" tab (workflow_dispatch) - useful for a first build right after
# uploading the source without triggering it via a push.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed so the job is allowed to push the build result back to the repo.
permissions:
  contents: write

concurrency:
  group: build-widgets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (root + src-widgets)
        run: npm run npm

      - name: Type-check, lint, test
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Build customWidgets.js
        run: npm run build

      - name: Commit build output back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add the whole build output directory, not just customWidgets.js:
          # that entry file dynamically imports a full assets/ folder of
          # chunks (React, each widget, CSS) at runtime, so committing only
          # the entry file leaves every one of those imports 404ing. `-f`
          # forces past the .gitignore entries for customWidgets.js itself
          # (assets/ was never gitignored, so this also fixes a second bug:
          # an earlier version of this step listed customWidgets.js and
          # customWidgets.js.map plus a "*.manifest.json" glob as separate
          # pathspecs in one `git add` call - when one pathspec in a call
          # matches no file (Module Federation actually names its manifest
          # "mf-manifest.json"), git aborts the WHOLE call and stages
          # nothing, which silently ate every previous build here.
          git add -f widgets/mywidgets/

          if git diff --staged --quiet; then
            echo "No changes to commit - build output already up to date."
          else
            git commit -m "chore: rebuild customWidgets.js [skip ci]"
            git push
          fi
